<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0b" />
		<title>%sveltekit.error.message% · Job Tracker</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fafafa;
				--fg: #18181b;
				--muted: #52525b;
				--accent: #18181b;
				--accent-fg: #fafafa;
				--border: #e4e4e7;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0a0a0b;
					--fg: #fafafa;
					--muted: #a1a1aa;
					--accent: #fafafa;
					--accent-fg: #0a0a0b;
					--border: #27272a;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				background: var(--bg);
				color: var(--fg);
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					'Helvetica Neue',
					Arial,
					sans-serif;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}
			main {
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				justify-content: center;
				max-width: 40rem;
				margin: 0 auto;
				padding: 4rem 1.5rem;
			}
			.eyebrow {
				font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
				font-size: 0.8125rem;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				color: var(--muted);
				margin: 0;
			}
			h1 {
				margin: 0.75rem 0 1rem;
				font-size: clamp(2rem, 5vw, 3rem);
				font-weight: 600;
				letter-spacing: -0.02em;
				line-height: 1.1;
				text-wrap: balance;
			}
			p {
				margin: 0 0 1rem;
				color: var(--muted);
				line-height: 1.6;
			}
			p:last-of-type {
				margin-bottom: 2.5rem;
			}
			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				padding: 0.625rem 1.25rem;
				border-radius: 0.5rem;
				background: var(--accent);
				color: var(--accent-fg);
				text-decoration: none;
				font-size: 0.875rem;
				font-weight: 500;
				transition: opacity 0.15s ease;
			}
			a:hover {
				opacity: 0.85;
			}
			a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="eyebrow">Error %sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<p>The page or resource you tried to reach is unavailable.</p>
			<p>You can head back to the start and try again.</p>
			<a href="/">Back to home</a>
		</main>
	</body>
</html>

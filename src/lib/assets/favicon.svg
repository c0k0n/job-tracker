<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
	<title>Job Tracker</title>
	<!--
		Funnel mark: three bars, widest at the top and narrowing downward —
		the same shape the dashboard's ConversionFunnel draws. Fills are the
		flattened sRGB equivalents of the design tokens --color-accent
		(oklch(0.21 0 0)) and --color-bg (oklch(0.99 0 0)), so the icon keeps
		the app's neutral single-accent language at 16px.
	-->
	<rect width="32" height="32" rx="7" fill="#262626" />
	<g fill="#fafafa">
		<rect x="7" y="9" width="18" height="3.4" rx="1.2" />
		<rect x="9" y="14.3" width="14" height="3.4" rx="1.2" />
		<rect x="11" y="19.6" width="10" height="3.4" rx="1.2" />
	</g>
</svg>

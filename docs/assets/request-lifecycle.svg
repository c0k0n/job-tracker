<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Request lifecycle: browser to Worker to D1 and back">
	<title>Request lifecycle</title>
	<style>
		.bg { fill: #0d1117; }
		.box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
		.box-db { fill: #161b22; stroke: #1f6feb; stroke-width: 1.5; }
		.lbl { fill: #e6edf3; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
		.sub { fill: #8b949e; font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
		.wire { stroke: #484f58; stroke-width: 1.5; fill: none; }
		.wire-hi { stroke: #58a6ff; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
		.dot { fill: #58a6ff; }
		.tag { fill: #f0b429; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
		@keyframes dash { to { stroke-dashoffset: -40; } }
		.flowing { animation: dash 1.6s linear infinite; }
		@keyframes glow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
		.pulse1 { animation: glow 2.4s ease-in-out infinite; }
		.pulse2 { animation: glow 2.4s ease-in-out infinite .6s; }
		.pulse3 { animation: glow 2.4s ease-in-out infinite 1.2s; }
		.pulse4 { animation: glow 2.4s ease-in-out infinite 1.8s; }
	</style>

	<rect class="bg" x="0" y="0" width="780" height="300" rx="10"/>

	<!-- row 1 -->
	<rect class="box" x="24" y="34" width="150" height="56" rx="8"/>
	<text class="lbl" x="99" y="58" text-anchor="middle">Browser</text>
	<text class="sub" x="99" y="76" text-anchor="middle">GET /dashboard</text>

	<rect class="box" x="222" y="34" width="190" height="56" rx="8"/>
	<text class="lbl" x="317" y="58" text-anchor="middle">hooks.server.ts</text>
	<text class="sub" x="317" y="76" text-anchor="middle">handle()</text>

	<rect class="box" x="460" y="34" width="190" height="56" rx="8"/>
	<text class="lbl" x="555" y="58" text-anchor="middle">better-auth</text>
	<text class="sub" x="555" y="76" text-anchor="middle">getSession()</text>

	<rect class="box" x="698" y="34" width="58" height="56" rx="8"/>
	<text class="lbl" x="727" y="58" text-anchor="middle" font-size="11">locals</text>
	<text class="sub" x="727" y="76" text-anchor="middle" font-size="9">user</text>

	<path class="wire" d="M174 62 H222"/>
	<path class="wire-hi flowing" d="M174 62 H222"/>
	<path class="wire" d="M412 62 H460"/>
	<path class="wire-hi flowing" d="M412 62 H460"/>
	<path class="wire" d="M650 62 H698"/>
	<path class="wire-hi flowing" d="M650 62 H698"/>

	<!-- row 2 -->
	<rect class="box" x="222" y="130" width="190" height="56" rx="8"/>
	<text class="lbl" x="317" y="154" text-anchor="middle">+page.server.ts</text>
	<text class="sub" x="317" y="172" text-anchor="middle">load(event)</text>

	<rect class="box-db" x="460" y="130" width="190" height="56" rx="8"/>
	<text class="lbl" x="555" y="154" text-anchor="middle">applications-data</text>
	<text class="sub" x="555" y="172" text-anchor="middle">getDashboardData()</text>

	<rect class="box-db" x="698" y="130" width="58" height="56" rx="8"/>
	<text class="lbl" x="727" y="154" text-anchor="middle" font-size="11">D1</text>
	<text class="sub" x="727" y="172" text-anchor="middle" font-size="9">DB</text>

	<path class="wire" d="M317 90 V130"/>
	<path class="wire" d="M412 158 H460"/>
	<path class="wire-hi flowing" d="M412 158 H460"/>
	<path class="wire" d="M650 158 H698"/>
	<path class="wire-hi flowing" d="M650 158 H698"/>

	<!-- row 3 -->
	<rect class="box" x="24" y="226" width="150" height="56" rx="8"/>
	<text class="lbl" x="99" y="250" text-anchor="middle">SSR HTML</text>
	<text class="sub" x="99" y="268" text-anchor="middle">+ security headers</text>

	<rect class="box" x="222" y="226" width="190" height="56" rx="8"/>
	<text class="lbl" x="317" y="250" text-anchor="middle">Svelte 5 render</text>
	<text class="sub" x="317" y="268" text-anchor="middle">runes, no effects</text>

	<path class="wire" d="M99 186 V226"/>
	<path class="wire" d="M222 254 H174"/>
	<path class="wire-hi flowing" d="M222 254 H174"/>

	<text class="tag" x="24" y="24">worker invocation  ·  10 ms CPU budget</text>
	<text class="tag" x="470" y="214">50 queries max</text>

	<circle class="dot pulse1" cx="198" cy="62" r="4"/>
	<circle class="dot pulse2" cx="436" cy="62" r="4"/>
	<circle class="dot pulse3" cx="436" cy="158" r="4"/>
	<circle class="dot pulse4" cx="674" cy="158" r="4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Resume upload: browser posts a PDF, the Worker validates it, writes bytes to R2, writes metadata to D1, and attaches it to an application">
	<title>Resume upload and attach flow</title>
	<style>
		.bg { fill: #0d1117; }
		.box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
		.box-r2 { fill: #161b22; stroke: #f0b429; stroke-width: 1.5; }
		.box-db { fill: #161b22; stroke: #1f6feb; stroke-width: 1.5; }
		.box-bad { fill: #161b22; stroke: #f85149; stroke-width: 1.5; }
		.lbl { fill: #e6edf3; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
		.sub { fill: #8b949e; font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
		.wire { stroke: #484f58; stroke-width: 1.5; fill: none; }
		.wire-hi { stroke: #58a6ff; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
		.wire-amber { stroke: #f0b429; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
		.wire-red { stroke: #f85149; stroke-width: 1.5; fill: none; stroke-dasharray: 3 4; }
		.tag { fill: #f0b429; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
		.tag-red { fill: #f85149; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
		.dot { fill: #58a6ff; }
		.dot-amber { fill: #f0b429; }
		@keyframes dash { to { stroke-dashoffset: -40; } }
		.flowing { animation: dash 1.6s linear infinite; }
		@keyframes glow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
		.pulse1 { animation: glow 2.4s ease-in-out infinite; }
		.pulse2 { animation: glow 2.4s ease-in-out infinite .6s; }
		.pulse3 { animation: glow 2.4s ease-in-out infinite 1.2s; }
		.pulse4 { animation: glow 2.4s ease-in-out infinite 1.8s; }
	</style>

	<rect class="bg" x="0" y="0" width="780" height="330" rx="10"/>

	<!-- row 1 · happy path -->
	<rect class="box" x="24" y="40" width="132" height="52" rx="8"/>
	<text class="lbl" x="90" y="62" text-anchor="middle">Browser</text>
	<text class="sub" x="90" y="80" text-anchor="middle">multipart PDF</text>

	<rect class="box" x="196" y="40" width="170" height="52" rx="8"/>
	<text class="lbl" x="281" y="62" text-anchor="middle">POST /api/resumes</text>
	<text class="sub" x="281" y="80" text-anchor="middle">validate</text>

	<rect class="box-r2" x="406" y="40" width="160" height="52" rx="8"/>
	<text class="lbl" x="486" y="62" text-anchor="middle">R2 · RESUMES</text>
	<text class="sub" x="486" y="80" text-anchor="middle">put(bytes)</text>

	<rect class="box-db" x="606" y="40" width="150" height="52" rx="8"/>
	<text class="lbl" x="681" y="62" text-anchor="middle">D1 · resume row</text>
	<text class="sub" x="681" y="80" text-anchor="middle">INSERT</text>

	<path class="wire" d="M156 66 H196"/>
	<path class="wire-hi flowing" d="M156 66 H196"/>
	<path class="wire" d="M366 66 H406"/>
	<path class="wire-amber flowing" d="M366 66 H406"/>
	<path class="wire" d="M566 66 H606"/>
	<path class="wire-hi flowing" d="M566 66 H606"/>

	<!-- gates -->
	<rect class="box-bad" x="196" y="112" width="170" height="46" rx="8"/>
	<text class="lbl" font-size="11" x="281" y="132" text-anchor="middle">413 too large</text>
	<text class="sub" font-size="10" x="281" y="149" text-anchor="middle">415 not %PDF-</text>

	<path class="wire-red" d="M281 92 V112"/>
	<path class="wire-red" d="M281 158 V112" stroke-dasharray="3 4"/>
	<text class="tag-red" x="196" y="106">rejected before any write</text>

	<!-- row 2 · attach -->
	<rect class="box" x="24" y="172" width="132" height="52" rx="8"/>
	<text class="lbl" font-size="12" x="90" y="194" text-anchor="middle">ApplicationForm</text>
	<text class="sub" x="90" y="212" text-anchor="middle">resumeId</text>

	<rect class="box" x="196" y="172" width="170" height="52" rx="8"/>
	<text class="lbl" font-size="12" x="281" y="194" text-anchor="middle">?/create · ?/edit</text>
	<text class="sub" x="281" y="212" text-anchor="middle">isResumeOwned()</text>

	<rect class="box-db" x="406" y="172" width="160" height="52" rx="8"/>
	<text class="lbl" font-size="12" x="486" y="194" text-anchor="middle">application.resume_id</text>
	<text class="sub" x="486" y="212" text-anchor="middle">nullable · no FK</text>

	<rect class="box-r2" x="606" y="172" width="150" height="52" rx="8"/>
	<text class="lbl" font-size="12" x="681" y="194" text-anchor="middle">GET /api/resumes/id</text>
	<text class="sub" x="681" y="212" text-anchor="middle">proxied · no-store</text>

	<path class="wire" d="M156 198 H196"/>
	<path class="wire-hi flowing" d="M156 198 H196"/>
	<path class="wire" d="M366 198 H406"/>
	<path class="wire-hi flowing" d="M366 198 H406"/>
	<path class="wire" d="M566 198 H606"/>
	<path class="wire-amber flowing" d="M566 198 H606"/>

	<!-- row 3 · delete -->
	<rect class="box-r2" x="196" y="256" width="170" height="52" rx="8"/>
	<text class="lbl" font-size="12" x="281" y="278" text-anchor="middle">DELETE /api/resumes/id</text>
	<text class="sub" font-size="10" x="281" y="296" text-anchor="middle">object + row + detach</text>

	<rect class="box-db" x="406" y="256" width="160" height="52" rx="8"/>
	<text class="lbl" font-size="12" x="486" y="278" text-anchor="middle">application survives</text>
	<text class="sub" x="486" y="296" text-anchor="middle">resume_id = NULL</text>

	<path class="wire" d="M366 282 H406"/>
	<path class="wire-hi flowing" d="M366 282 H406"/>
	<path class="wire-red" d="M486 224 V256"/>

	<text class="tag" x="24" y="28">key is always userId/resumeId.pdf — never user input</text>
	<text class="tag" x="606" y="250">D1 write fails → object deleted</text>

	<circle class="dot pulse1" cx="176" cy="66" r="4"/>
	<circle class="dot-amber pulse2" cx="386" cy="66" r="4"/>
	<circle class="dot pulse3" cx="386" cy="198" r="4"/>
	<circle class="dot-amber pulse4" cx="586" cy="198" r="4"/>
</svg>

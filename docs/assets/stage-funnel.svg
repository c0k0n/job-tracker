<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 356" width="780" height="356" role="img" aria-label="Application stage funnel: seven rungs from applied to accepted, with exits counted separately">
	<title>Application stage funnel</title>
	<style>
		.bg { fill: #0d1117; }
		.bar { fill: #1f6feb; }
		.exit { fill: #8b949e; }
		.track { fill: #21262d; }
		.lbl { fill: #e6edf3; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
		.num { fill: #8b949e; font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
		.hd { fill: #f0b429; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
		.foot { fill: #6e7681; font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
		@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
		@keyframes slide { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
		.g1 { animation: grow .9s cubic-bezier(.2,.7,.2,1) both; transform-origin: 0 0; }
		.g2 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .10s both; transform-origin: 0 0; }
		.g3 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .20s both; transform-origin: 0 0; }
		.g4 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .30s both; transform-origin: 0 0; }
		.g5 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .40s both; transform-origin: 0 0; }
		.g6 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .50s both; transform-origin: 0 0; }
		.g7 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .60s both; transform-origin: 0 0; }
		.t1 { animation: slide .6s ease-out .1s both; }
		.t2 { animation: slide .6s ease-out .2s both; }
		.t3 { animation: slide .6s ease-out .3s both; }
		.t4 { animation: slide .6s ease-out .4s both; }
		.t5 { animation: slide .6s ease-out .5s both; }
		.t6 { animation: slide .6s ease-out .6s both; }
		.t7 { animation: slide .6s ease-out .7s both; }
		.t8 { animation: slide .6s ease-out .8s both; }
	
		/* Motion is decoration, and the animation is load-bearing in a way
		   that is easy to miss: these rules use `animation-fill-mode: both`
		   so before the delay elapses each element sits at its `from`
		   keyframe. For the slide-in classes that keyframe is `opacity: 0`,
		   and for the grow classes it is `scaleX(0)` — so wherever animation
		   does not run (a reduced-motion preference, a renderer that drops
		   the style element, a static export) the labels and the bars stay
		   invisible instead of merely unanimated. The end state has to be
		   the resting state. */
		@media (prefers-reduced-motion: reduce) {
			.g1, .g2, .g3, .g4, .g5, .g6, .g7, .t1, .t2, .t3, .t4, .t5,
			.t6, .t7, .t8
			{
				animation: none !important;
				opacity: 1;
				transform: none;
			}
		}
</style>

	<rect class="bg" x="0" y="0" width="780" height="356" rx="10"/>
	<text class="hd" x="28" y="30">CONVERSION FUNNEL — at or past each stage</text>

	<!--
		Seven rungs, and they are exactly the open progression. `saved` is not
		here (it has not entered the pipeline) and neither are `rejected` or
		`withdrawn` (they are exits, and a "reached at or past this stage"
		test can never be satisfied by an application that has left). Both are
		shown in the footer strip instead.
	-->
	<g transform="translate(28,52)">
		<text class="lbl t1" x="0" y="21">Applied</text>
		<rect class="track" x="120" y="8" width="600" height="18" rx="4"/>
		<rect class="bar g1" x="120" y="8" width="600" height="18" rx="4"/>
		<text class="num" x="720" y="22" text-anchor="end">100%</text>

		<text class="lbl t2" x="0" y="57">Phone screen</text>
		<rect class="track" x="120" y="44" width="600" height="18" rx="4"/>
		<rect class="bar g2" x="120" y="44" width="432" height="18" rx="4"/>
		<text class="num" x="720" y="58" text-anchor="end">72% · 72% of prev</text>

		<text class="lbl t3" x="0" y="93">Technical</text>
		<rect class="track" x="120" y="80" width="600" height="18" rx="4"/>
		<rect class="bar g3" x="120" y="80" width="330" height="18" rx="4"/>
		<text class="num" x="720" y="94" text-anchor="end">55% · 76% of prev</text>

		<text class="lbl t4" x="0" y="129">Onsite</text>
		<rect class="track" x="120" y="116" width="600" height="18" rx="4"/>
		<rect class="bar g4" x="120" y="116" width="264" height="18" rx="4"/>
		<text class="num" x="720" y="130" text-anchor="end">44% · 80% of prev</text>

		<text class="lbl t5" x="0" y="165">Final round</text>
		<rect class="track" x="120" y="152" width="600" height="18" rx="4"/>
		<rect class="bar g5" x="120" y="152" width="180" height="18" rx="4"/>
		<text class="num" x="720" y="166" text-anchor="end">30% · 68% of prev</text>

		<text class="lbl t6" x="0" y="201">Offer</text>
		<rect class="track" x="120" y="188" width="600" height="18" rx="4"/>
		<rect class="bar g6" x="120" y="188" width="96" height="18" rx="4"/>
		<text class="num" x="720" y="202" text-anchor="end">16% · 53% of prev</text>

		<text class="lbl t7" x="0" y="237">Accepted</text>
		<rect class="track" x="120" y="224" width="600" height="18" rx="4"/>
		<rect class="bar g7" x="120" y="224" width="48" height="18" rx="4" opacity="0.55"/>
		<text class="num" x="720" y="238" text-anchor="end">8% · 50% of prev</text>
	</g>

	<!-- Exits and pre-pipeline work: exact counts, never rungs. -->
	<g transform="translate(28,318)">
		<rect class="exit" x="0" y="0" width="26" height="10" rx="2" opacity="0.7"/>
		<text class="foot" x="34" y="9">3 saved · 2 rejected · 1 withdrawn — counted separately, no % of prev</text>
	</g>

	<text class="foot" x="28" y="344">rendered by ConversionFunnel.svelte from live counts — illustrative figures</text>
</svg>

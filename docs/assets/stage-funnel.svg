<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Animated application stage funnel">
	<title>Application stage funnel</title>
	<style>
		.bg { fill: #0d1117; }
		.bar { fill: #1f6feb; }
		.track { fill: #21262d; }
		.lbl { fill: #e6edf3; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
		.num { fill: #8b949e; font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
		.hd { fill: #f0b429; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
		@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
		@keyframes slide { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
		.g1 { animation: grow .9s cubic-bezier(.2,.7,.2,1) both; transform-origin: 0 0; }
		.g2 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .12s both; transform-origin: 0 0; }
		.g3 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .24s both; transform-origin: 0 0; }
		.g4 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .36s both; transform-origin: 0 0; }
		.g5 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .48s both; transform-origin: 0 0; }
		.g6 { animation: grow .9s cubic-bezier(.2,.7,.2,1) .60s both; transform-origin: 0 0; }
		.t1 { animation: slide .6s ease-out .1s both; }
		.t2 { animation: slide .6s ease-out .2s both; }
		.t3 { animation: slide .6s ease-out .3s both; }
		.t4 { animation: slide .6s ease-out .4s both; }
		.t5 { animation: slide .6s ease-out .5s both; }
		.t6 { animation: slide .6s ease-out .6s both; }
	</style>

	<rect class="bg" x="0" y="0" width="780" height="300" rx="10"/>
	<text class="hd" x="28" y="30">CONVERSION FUNNEL  ·  counts per stage</text>

	<g transform="translate(28,52)">
		<text class="lbl t1" x="0" y="20">Applied</text>
		<rect class="track" x="120" y="8" width="600" height="18" rx="4"/>
		<rect class="bar g1" x="120" y="8" width="600" height="18" rx="4"/>
		<text class="num" x="720" y="22" text-anchor="end">100%</text>

		<text class="lbl t2" x="0" y="60">Screening</text>
		<rect class="track" x="120" y="48" width="600" height="18" rx="4"/>
		<rect class="bar g2" x="120" y="48" width="402" height="18" rx="4"/>
		<text class="num" x="720" y="62" text-anchor="end">67%</text>

		<text class="lbl t3" x="0" y="100">Interview</text>
		<rect class="track" x="120" y="88" width="600" height="18" rx="4"/>
		<rect class="bar g3" x="120" y="88" width="258" height="18" rx="4"/>
		<text class="num" x="720" y="102" text-anchor="end">43%</text>

		<text class="lbl t4" x="0" y="140">Technical</text>
		<rect class="track" x="120" y="128" width="600" height="18" rx="4"/>
		<rect class="bar g4" x="120" y="128" width="162" height="18" rx="4"/>
		<text class="num" x="720" y="142" text-anchor="end">27%</text>

		<text class="lbl t5" x="0" y="180">Offer</text>
		<rect class="track" x="120" y="168" width="600" height="18" rx="4"/>
		<rect class="bar g5" x="120" y="168" width="78" height="18" rx="4"/>
		<text class="num" x="720" y="182" text-anchor="end">13%</text>

		<text class="lbl t6" x="0" y="220">Accepted</text>
		<rect class="track" x="120" y="208" width="600" height="18" rx="4"/>
		<rect class="bar g6" x="120" y="208" width="42" height="18" rx="4" opacity="0.55"/>
		<text class="num" x="720" y="222" text-anchor="end">7%</text>
	</g>
	<text class="num" x="28" y="288">rendered by ConversionFunnel.svelte from live counts · illustrative figures</text>
</svg>
